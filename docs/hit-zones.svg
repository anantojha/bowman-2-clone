<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t d">
  <title id="t">Hit zones and damage</title>
  <desc id="d">A stickman with three highlighted hit boxes: head takes 50 damage, body 25, legs 15. Each archer starts with 100 HP.</desc>
  <style>
    .f{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  </style>
  <rect width="820" height="440" rx="22" fill="#1b2a3a"/>
  <rect x=".75" y=".75" width="818.5" height="438.5" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
  <text class="f" x="36" y="50" font-size="24" font-weight="800" fill="#f3f6fa">Where you hit matters</text>
  <text class="f" x="36" y="76" font-size="14.5" fill="#a9b8c8">Both archers start with 100 HP. These are the same hit boxes the server uses.</text>

  <!-- scale 4.2 px per game px; feet at (190, 410) -->
  <ellipse cx="190" cy="412" rx="62" ry="9" fill="#000" opacity=".25"/>
  <circle cx="190" cy="150" r="50.4" fill="#f2c14e" fill-opacity=".22" stroke="#f2c14e" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="148" y="191.6" width="84" height="117.6" rx="4" fill="#e0524a" fill-opacity=".22" stroke="#e0524a" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="152.2" y="309.2" width="75.6" height="100.8" rx="4" fill="#3b82e0" fill-opacity=".25" stroke="#3b82e0" stroke-width="3" stroke-dasharray="7 6"/>
  <g fill="none" stroke="#f3f6fa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="190" cy="150" r="42" fill="#f7f0e4" stroke="#f3f6fa" stroke-width="5" fill-opacity=".95"/>
    <line x1="190" y1="192" x2="190" y2="309"/>
    <line x1="190" y1="309" x2="158" y2="408"/><line x1="190" y1="309" x2="222" y2="408"/>
    <line x1="190" y1="216" x2="262" y2="196"/><line x1="190" y1="216" x2="170" y2="232"/>
  </g>
  <line x1="148" y1="148" x2="232" y2="148" stroke="#3b82e0" stroke-width="6" stroke-linecap="round" opacity="0"/>
  <circle cx="204" cy="148" r="4" fill="#15202b"/>
  <path d="M258 150 Q300 196 258 242" fill="none" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>

  <!-- leader lines -->
  <g stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 5">
    <line x1="246" y1="128" x2="392" y2="128"/>
    <line x1="236" y1="250" x2="392" y2="250"/>
    <line x1="232" y1="360" x2="392" y2="360"/>
  </g>

  <!-- rows -->
  <g class="f">
    <circle cx="456" cy="128" r="46" fill="#f2c14e"/><text x="456" y="141" text-anchor="middle" font-size="40" font-weight="900" fill="#1b2a3a">50</text>
    <text x="528" y="120" font-size="26" font-weight="800" fill="#f2c14e" letter-spacing="2">HEAD</text>
    <text x="528" y="146" font-size="15" fill="#a9b8c8">Headshot. Two hits win the duel.</text>

    <circle cx="456" cy="250" r="46" fill="#e0524a"/><text x="456" y="263" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">25</text>
    <text x="528" y="242" font-size="26" font-weight="800" fill="#e0524a" letter-spacing="2">BODY</text>
    <text x="528" y="268" font-size="15" fill="#a9b8c8">Solid hit. Four hits to finish.</text>

    <circle cx="456" cy="360" r="46" fill="#3b82e0"/><text x="456" y="373" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">15</text>
    <text x="528" y="352" font-size="26" font-weight="800" fill="#3b82e0" letter-spacing="2">LEGS</text>
    <text x="528" y="378" font-size="15" fill="#a9b8c8">Graze. Seven hits to finish.</text>
  </g>
</svg>
