<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">What happens in one turn</title>
  <desc id="d">Your browser sends shoot with angle and power to the server. The server simulates the arrow, then sends the full flight path to both browsers, which replay it before the next turn starts.</desc>
  <defs>
    <marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#f2c14e"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7db4f5"/></marker>
  </defs>
  <style>.f{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style>
  <rect width="900" height="470" rx="22" fill="#1b2a3a"/>
  <rect x=".75" y=".75" width="898.5" height="468.5" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
  <g class="f">
    <text x="36" y="48" font-size="24" font-weight="800" fill="#f3f6fa">One turn, start to finish</text>
    <text x="36" y="74" font-size="14.5" fill="#a9b8c8">The server owns the physics, so everybody sees the same shot and nobody can cheat.</text>

    <!-- lifelines -->
    <g stroke="#ffffff" stroke-opacity=".22" stroke-width="2" stroke-dasharray="4 7">
      <line x1="150" y1="170" x2="150" y2="440"/><line x1="450" y1="170" x2="450" y2="440"/><line x1="750" y1="170" x2="750" y2="440"/>
    </g>
    <g font-size="16" font-weight="800" text-anchor="middle">
      <rect x="60" y="116" width="180" height="48" rx="12" fill="#3b82e0"/><text x="150" y="146" fill="#fff">Your browser</text>
      <rect x="360" y="116" width="180" height="48" rx="12" fill="#f2c14e"/><text x="450" y="146" fill="#1b2a3a">Python server</text>
      <rect x="660" y="116" width="180" height="48" rx="12" fill="#e0524a"/><text x="750" y="146" fill="#fff">Opponent's browser</text>
    </g>

    <!-- 1 shoot -->
    <line x1="156" y1="212" x2="442" y2="212" stroke="#f2c14e" stroke-width="3" marker-end="url(#gold)"/>
    <text x="300" y="202" text-anchor="middle" font-size="15" fill="#f3f6fa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">shoot { angle, power }</text>
    <circle cx="96" cy="212" r="15" fill="#f2c14e"/><text x="96" y="218" text-anchor="middle" font-size="16" font-weight="900" fill="#1b2a3a">1</text>

    <!-- 2 simulate -->
    <rect x="292" y="244" width="316" height="62" rx="12" fill="#243a50" stroke="#f2c14e" stroke-opacity=".6" stroke-width="2"/>
    <text x="450" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#f3f6fa">Flies the arrow in 1/120 s steps</text>
    <text x="450" y="291" text-anchor="middle" font-size="13.5" fill="#a9b8c8">gravity · wind · terrain · head / body / legs</text>
    <circle cx="262" cy="275" r="15" fill="#f2c14e"/><text x="262" y="281" text-anchor="middle" font-size="16" font-weight="900" fill="#1b2a3a">2</text>

    <!-- 3 shot -->
    <line x1="444" y1="346" x2="158" y2="346" stroke="#7db4f5" stroke-width="3" marker-end="url(#blue)"/>
    <line x1="456" y1="346" x2="742" y2="346" stroke="#7db4f5" stroke-width="3" marker-end="url(#blue)"/>
    <text x="300" y="336" text-anchor="middle" font-size="15" fill="#f3f6fa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">shot { path, hit, hp, next }</text>
    <text x="600" y="336" text-anchor="middle" font-size="15" fill="#a9b8c8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">same message</text>
    <circle cx="96" cy="346" r="15" fill="#7db4f5"/><text x="96" y="352" text-anchor="middle" font-size="16" font-weight="900" fill="#1b2a3a">3</text>

    <!-- 4 replay -->
    <rect x="72" y="384" width="156" height="44" rx="12" fill="#243a50" stroke="#7db4f5" stroke-opacity=".6" stroke-width="2"/>
    <text x="150" y="411" text-anchor="middle" font-size="14.5" font-weight="700" fill="#f3f6fa">Replays the path</text>
    <rect x="672" y="384" width="156" height="44" rx="12" fill="#243a50" stroke="#7db4f5" stroke-opacity=".6" stroke-width="2"/>
    <text x="750" y="411" text-anchor="middle" font-size="14.5" font-weight="700" fill="#f3f6fa">Replays the path</text>
    <circle cx="300" cy="406" r="15" fill="#7db4f5"/><text x="300" y="412" text-anchor="middle" font-size="16" font-weight="900" fill="#1b2a3a">4</text>
    <text x="450" y="411" text-anchor="middle" font-size="14.5" fill="#a9b8c8">then: next turn, fresh wind</text>
  </g>
</svg>
